<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZAP Clinic - Reservasi Online</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col justify-between">
    <header class="sticky top-0 z-50 bg-white/95 backdrop-blur-md border-b border-pink-100 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex justify-between items-center">
            <span class="text-2xl font-black text-slate-800" onclick="location.href='index.html'">ZAP<span class="text-pink-500">.</span></span>
            <nav class="hidden md:flex space-x-8">
                <a href="index.html" class="nav-link text-sm">Beranda</a>
                <a href="katalog.html" class="nav-link text-sm">Katalog Treatment</a>
                <a href="dokter.html" class="nav-link text-sm">Dokter & Beautician</a>
                <a href="jadwal.html" class="nav-link text-sm text-pink-500 font-bold border-b-2 border-pink-500">Reservasi Online</a>
                <a href="riwayat.html" class="nav-link text-sm">Riwayat</a>
            </nav>
        </div>
    </header>

    <main class="flex-grow py-12">
        <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="bg-white rounded-3xl shadow-xl border border-pink-100 overflow-hidden">
                <div class="bg-gradient-to-r from-pink-500 to-rose-500 p-6 sm:p-8 text-white">
                    <h1 class="text-2xl sm:text-3xl font-extrabold flex items-center gap-3">
                        <i class="fa-regular fa-calendar-plus"></i> Form Reservasi Online ZAP
                    </h1>
                </div>
                <form id="bookingForm" onsubmit="handleBookingSubmit(event)" class="p-6 sm:p-8 space-y-6">
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">1. Pilih Cabang Outlet ZAP</label>
                        <select id="book-branch" required class="w-full px-4 py-3 rounded-xl border border-slate-300 bg-slate-50 font-medium">
                            <option value="">-- Pilih Lokasi Cabang --</option>
                            <option value="ZAP Clinic - Jakarta Selatan (Senayan)">ZAP Clinic - Jakarta Selatan (Senayan)</option>
                            <option value="ZAP Clinic - Medan (Sun Plaza)">ZAP Clinic - Medan (Sun Plaza)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">2. Pilih Treatment</label>
                        <select id="book-treatment" required onchange="updateBookingSummary()" class="w-full px-4 py-3 rounded-xl border border-slate-300 bg-slate-50 font-medium">
                            <option value="">-- Pilih Jenis Treatment --</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">3. Pilih Dokter / Beautician</label>
                        <select id="book-doctor" required class="w-full px-4 py-3 rounded-xl border border-slate-300 bg-slate-50 font-medium">
                            <option value="">-- Pilih Dokter / Beautician --</option>
                        </select>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-2">4. Tanggal Kedatangan</label>
                            <input type="date" id="book-date" required class="w-full px-4 py-3 rounded-xl border border-slate-300 bg-slate-50 font-medium">
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-2">Waktu / Slot Jam</label>
                            <select id="book-time" required class="w-full px-4 py-3 rounded-xl border border-slate-300 bg-slate-50 font-medium">
                                <option value="">-- Pilih Jam --</option>
                                <option value="10:00 WIB">10:00 WIB</option>
                                <option value="15:00 WIB">15:00 WIB</option>
                            </select>
                        </div>
                    </div>
                    <div class="pt-4 border-t border-slate-200">
                        <h3 class="text-sm font-bold text-slate-800 uppercase tracking-wider mb-3">Informasi Pasien</h3>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <input type="text" id="book-name" placeholder="Nama Lengkap" required class="w-full px-4 py-2.5 rounded-xl border border-slate-300">
                            <input type="tel" id="book-phone" placeholder="No. WhatsApp (12 digit)" required class="w-full px-4 py-2.5 rounded-xl border border-slate-300">
                        </div>
                    </div>
                    <button type="submit" class="w-full bg-pink-500 text-white font-bold py-4 rounded-xl shadow-lg hover:bg-pink-600 transition-all">
                        Konfirmasi & Simpan Reservasi
                    </button>
                </form>
            </div>
        </div>
    </main>

    <!-- Modal Sukses/Detail -->
    <div id="bookingModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-lg w-full p-6 relative shadow-2xl">
            <h3 class="text-2xl font-bold text-slate-800 mb-2">Bukti Reservasi ZAP</h3>
            <div id="modal-content" class="py-4 space-y-2 text-sm"></div>
            <button onclick="closeModal(); location.href='riwayat.html';" class="w-full bg-pink-500 text-white font-bold py-3 rounded-xl mt-4">Lihat di Riwayat</button>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            populateBookingDropdowns();
        });
    </script>
</body>
</html>
